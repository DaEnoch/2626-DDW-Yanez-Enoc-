{# muestra los mensajes flash con estilo Bootstrap #}
{% with mensajes = get_flashed_messages(with_categories=true) %}
    {% for categoria, mensaje in mensajes %}
    <div class="alert alert-{{ categoria if categoria in ['success', 'danger'] else 'info' }} alert-dismissible fade show" role="alert">
        {{ mensaje }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    {% endfor %}
{% endwith %}
