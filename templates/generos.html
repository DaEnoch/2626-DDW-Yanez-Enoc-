{% extends "base.html" %}

{% block title %}Géneros - EnoxhBeats{% endblock %}

{% block content %}
<main class="container my-5">
    <section class="seccion-card p-4 rounded-4">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
            <h2 class="titulo-seccion mb-0"><i class="bi bi-disc me-2"></i>Géneros Musicales</h2>
            <a href="{{ url_for('nuevo_genero') }}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-1"></i>Agregar genero
            </a>
        </div>
        <p>Géneros registrados en la base de datos.</p>
        <div class="row g-3">
            <!-- Recorremos la lista "generos" que app.py envia con render_template -->
            {% for genero in generos %}
            <div class="col-md-6 col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">{{ genero.nombre }}</h5>
                        <p class="card-text small">{{ genero.descripcion }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </section>
</main>
{% endblock %}
