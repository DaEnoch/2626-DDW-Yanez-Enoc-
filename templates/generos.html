{% extends "base.html" %}

{% block title %}Géneros - EnoxhBeats{% endblock %}

{% block content %}
<main class="container my-5">
    <section class="seccion-card p-4 rounded-4">
        <h2 class="titulo-seccion"><i class="bi bi-disc me-2"></i>Géneros Musicales</h2>
        <p>Géneros disponibles en la plataforma (datos de ejemplo).</p>

        <div class="row g-3">
            <!-- Recorremos la lista "generos" que app.py envia con render_template -->
            {% for genero in generos %}
            <div class="col-md-6 col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">{{ genero.nombre }}</h5>
                        <p class="card-text small">{{ genero.descripcion }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </section>
</main>
{% endblock %}
