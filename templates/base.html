<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EnoxhBeats{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS propio, cargado desde static con url_for -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- Componente navbar, se incluye en vez de repetirlo en cada pagina -->
{% include "components/navbar.html" %}

<!-- Aqui cada pagina hija mete su propio contenido -->
{% block content %}{% endblock %}

<!-- Componente footer -->
{% include "components/footer.html" %}

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- JS propio, cargado desde static con url_for -->
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<!-- Por si alguna pagina hija necesita agregar un script extra -->
{% block scripts %}{% endblock %}
</body>
</html>
